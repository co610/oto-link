<script>
"use strict";

/* HTMLエスケープ */
function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/* URLの安全性チェック */
function safeHttpUrl(value) {
  if (!value) return "";

  try {
    const url = new URL(value);

    return url.protocol === "https:" || url.protocol === "http:"
      ? url.href
      : "";
  } catch (error) {
    return "";
  }
}

/* 時間の入力形式を統一 */
function normalizeOptionalTime(value, label) {
  let time = String(value || "").trim();

  if (!time) return "";

  time = time
    .replace(/[０-９]/g, function(char) {
      return String.fromCharCode(char.charCodeAt(0) - 0xFEE0);
    })
    .replace(/：/g, ":");

  let match = time.match(/^(\d{1,2}):(\d{2})$/);

  if (!match && /^\d{3,4}$/.test(time)) {
    const hourPart = time.length === 3
      ? time.slice(0, 1)
      : time.slice(0, 2);

    const minutePart = time.slice(-2);
    match = [time, hourPart, minutePart];
  }

  if (!match) {
    throw new Error(
      label + "は「18:30」または「1830」の形式で入力してください。"
    );
  }

  const hours = Number(match[1]);
  const minutes = Number(match[2]);

  if (hours < 0 || hours > 23 || minutes < 0 || minutes > 59) {
    throw new Error(
      label + "は00:00〜23:59の範囲で入力してください。"
    );
  }

  return String(hours).padStart(2, "0") + ":" +
    String(minutes).padStart(2, "0");
}

/* ヘッダーのログイン表示 */
async function renderHeaderAccount() {
  const area = document.getElementById("headerAccount");

  if (!area) return;

  const user = await window.OTOAuth.getCurrentUser();

  if (user) {
    let userName = "プロフィール未設定";

    const profileResult = await window.OTO_SUPABASE
      .from("profiles")
      .select("id, data")
      .eq("id", user.id)
      .maybeSingle();

    if (
      !profileResult.error &&
      profileResult.data?.data?.name
    ) {
      userName = profileResult.data.data.name;
    } else {
      userName =
        user.user_metadata?.name ||
        user.user_metadata?.display_name ||
        user.email ||
        userName;
    }

    area.innerHTML = `
      <a href="profile.html">${escapeHtml(userName)}</a>
      <button type="button" id="logoutButton" class="logout-button">ログアウト</button>
    `;

    document.getElementById("logoutButton")
      .addEventListener("click", async function() {
        try {
          await window.OTOAuth.logout();
          window.location.href = "index.html";
        } catch (error) {
          console.error("ログアウトエラー:", error);
          alert("ログアウトできませんでした。もう一度お試しください。");
        }
      });

  } else {
    area.innerHTML = `
      <a href="login.html?returnTo=live-create.html">ログイン</a>
      <a href="signup.html">新規登録</a>
    `;
  }
}

/* 投稿フォームの処理 */
function setupLiveForm() {
  const form = document.getElementById("livePostForm");

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const submitButton = document.getElementById("submitLive");

    if (submitButton.disabled) return;

    submitButton.disabled = true;
    submitButton.textContent = "入力内容を確認しています…";

    try {
      /* ログイン状態の確認 */
      const authenticatedUser = await window.OTOAuth.requireUser();

      if (!authenticatedUser) {
        renderLoginRequired();
        return;
      }

      /* URLの確認 */
      const urlFields = [
        ["liveTicketUrl", "チケット予約・購入URL"],
        ["liveOfficialUrl", "公式サイトURL"],
        ["liveSocialUrl", "公式SNS・告知URL"]
      ];

      const checkedUrls = {};

      for (const [id, label] of urlFields) {
        const value = document.getElementById(id).value.trim();

        if (!value) {
          checkedUrls[id] = "";
          continue;
        }

        const safeUrl = safeHttpUrl(value);

        if (!safeUrl) {
          alert(
            label +
            "は https:// または http:// から始まるURLを入力してください。"
          );

          document.getElementById(id).focus();
          return;
        }

        checkedUrls[id] = safeUrl;
      }

      /* 時間の確認 */
      let openTime;
      let startTime;
      let endTime;

      try {
        openTime = normalizeOptionalTime(
          document.getElementById("liveOpenTime").value,
          "開場時間"
        );

        startTime = normalizeOptionalTime(
          document.getElementById("liveStartTime").value,
          "開演時間"
        );

        endTime = normalizeOptionalTime(
          document.getElementById("liveEndTime").value,
          "終演予定時間"
        );
      } catch (error) {
        alert(error.message);

        const timeIds = [
          "liveOpenTime",
          "liveStartTime",
          "liveEndTime"
        ];

        const invalidTimeId = timeIds.find(function(id) {
          const input = document.getElementById(id);

          if (!input.value.trim()) return false;

          try {
            normalizeOptionalTime(input.value, "時間");
            return false;
          } catch (validationError) {
            return true;
          }
        });

        if (invalidTimeId) {
          document.getElementById(invalidTimeId).focus();
        }

        return;
      }

      /* 保存直前にログインユーザーを再確認 */
      const activeUser = await window.OTOAuth.getCurrentUser();

      if (!activeUser) {
        renderLoginRequired();
        return;
      }

      if (activeUser.id !== authenticatedUser.id) {
        alert(
          "ログイン中のアカウントが変わりました。" +
          "内容を確認して、もう一度投稿してください。"
        );
        return;
      }

      /* 投稿データ */
      const postId = makeId();

      const post = {
        id: postId,
        userId: activeUser.id,

        name: document.getElementById("liveName").value.trim(),
        date: document.getElementById("liveDate").value,
        openTime: openTime,
        startTime: startTime,
        endTime: endTime,
        status: document.getElementById("liveStatus").value,
        genre: document.getElementById("liveGenre").value.trim(),
        performers: document.getElementById("livePerformers").value.trim(),
        description: document.getElementById("liveDescription").value.trim(),

        place: document.getElementById("livePlace").value.trim(),
        address: document.getElementById("liveAddress").value.trim(),
        access: document.getElementById("liveAccess").value.trim(),
        audience: document.getElementById("liveAudience").value.trim(),
        ageLimit: document.getElementById("liveAgeLimit").value.trim(),

        ticketPrice: document.getElementById("liveTicketPrice").value.trim(),
        ticketMethod: document.getElementById("liveTicketMethod").value.trim(),
        ticketUrl: checkedUrls.liveTicketUrl,

        organizer: document.getElementById("liveOrganizer").value.trim(),
        contact: document.getElementById("liveContact").value.trim(),
        officialUrl: checkedUrls.liveOfficialUrl,
        socialUrl: checkedUrls.liveSocialUrl,

        equipment: document.getElementById("liveEquipment").value.trim(),
        goods: document.getElementById("liveGoods").value.trim(),
        goodsTime: document.getElementById("liveGoodsTime").value.trim(),
        notice: document.getElementById("liveNotice").value.trim(),
        notes: document.getElementById("liveNotes").value.trim(),

        createdAt: new Date().toISOString()
      };

      /* Supabaseへ保存 */
      submitButton.textContent = "告知しています…";

      const result = await window.OTO_SUPABASE
        .from("posts")
        .insert({
          id: postId,
          user_id: activeUser.id,
          post_type: "live",
          data: post
        })
        .select("id")
        .single();

      if (result.error) {
        throw result.error;
      }

      alert("ライブ情報を告知しました。");
      window.location.href = "live-detail.html?id=" +
        encodeURIComponent(postId);

    } catch (error) {
      console.error("ライブ投稿エラー:", error);

      alert(
        "ライブ情報を投稿できませんでした。\n" +
        (error.message || "時間をおいて、もう一度お試しください。")
      );

    } finally {
      const currentButton = document.getElementById("submitLive");

      if (currentButton) {
        currentButton.disabled = false;
        currentButton.textContent = "ライブを告知する";
      }
    }
  });
}

/* 投稿ID生成 */
function makeId() {
  if (window.crypto && typeof window.crypto.randomUUID === "function") {
    return window.crypto.randomUUID();
  }

  return String(Date.now()) + Math.random().toString(16).slice(2);
}

/* ページ初期化 */
async function initializeLiveCreate() {
  try {
    await window.OTOAuth.ready;

    await renderHeaderAccount();

    const currentUser = await window.OTOAuth.getCurrentUser();

    if (!currentUser) {
      renderLoginRequired();
      return;
    }

    renderLiveForm();

  } catch (error) {
    console.error("ライブ告知ページ初期化エラー:", error);

    document.getElementById("postArea").innerHTML = `
      <div class="live-login-box">
        <h2>ページを読み込めませんでした</h2>
        <p>通信状態を確認して、もう一度ページを読み込んでください。</p>
      </div>
    `;
  }
}

initializeLiveCreate();
</script>
