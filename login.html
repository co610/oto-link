<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

  <style>
    .password-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-input-wrap input {
      width: 100%;
      padding-right: 48px;
      box-sizing: border-box;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 5px;
      color: #666;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .password-toggle svg {
      width: 22px;
      height: 22px;
      display: block;
    }
  </style>
</head>

<body>

  <a href="index.html" class="logo">OTO LINK</a>

  <nav class="global-nav">
    <a href="index.html" class="global-home">ホーム</a>

    <details class="global-search-menu">
      <summary>探す <span class="menu-chevron">⌄</span></summary>

      <div class="global-search-panel">
        <a href="bands.html" class="global-search-card">

            <small>一緒に活動する仲間を見つける</small>
          </span>
          <span class="global-search-arrow">→</span>

        <a href="live.html" class="global-search-card">

          <span class="global-search-text">
            <strong>ライブを探す</strong>
            <small>出演できるライブやイベント</small>
          </span>

        <a href="chat.html" class="global-search-card">

</header>

<section class="page-header">
  <h1>ログイン</h1>
  <p>OTO LINKにログイン</p>
</section>

<section class="profile-create">
  <div class="profile-form">

    <h2>ログイン</h2>

    <label>
      メールアドレス
      <input
        type="email"
        id="email"
        placeholder="example@email.com"
        autocomplete="email"
        required
      >
    </label>

    <label>
      パスワード
      <div class="password-input-wrap">
        <input
          type="password"
          id="password"
          placeholder="パスワード"
          autocomplete="current-password"
          required
        >

        <button
          type="button"
          class="password-toggle"
          id="passwordToggle"
          aria-label="パスワードを表示"
          aria-pressed="false"
        >
          <svg viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </label>

    <button
      type="button"
      class="profile-button"
      id="loginButton"
      onclick="login()"
    >
      ログイン
    </button>

    <p class="form-link">
      アカウントを持っていない人は
      <a href="signup.html" id="signupLink">新規登録</a>
    </p>

  </div>
</section>

<footer>
  <p>© 2026 OTO LINK</p>
</footer>

<!-- Supabaseライブラリ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Supabase設定 -->
<script src="supabase-config.js"></script>
<script src="supabase.js"></script>

<script>

// 戻り先として許可するページ
const allowedReturnPages = [
  "activity-create.html",
  "member-create.html",
  "live-create.html"
];


// returnToを取得
function getReturnTo() {
  const requestedPage =
    new URLSearchParams(window.location.search).get("returnTo");

  return allowedReturnPages.includes(requestedPage)
    ? requestedPage
    : "index.html";
}


// 新規登録リンクにも戻り先を引き継ぐ
(function preserveReturnToForSignup() {
  const returnTo =
    new URLSearchParams(window.location.search).get("returnTo");

  if (!allowedReturnPages.includes(returnTo)) return;

  document.getElementById("signupLink").href =
    "signup.html?returnTo=" + encodeURIComponent(returnTo);
})();


// パスワード表示・非表示用アイコン
function getEyeIcon(isVisible) {

  // パスワード表示中：斜線あり
  if (isVisible) {
    return `
      <svg viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round">
        <path d="M3 3L21 21"/>
        <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
        <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c5 0 8.5 4.5 9 7-.2 1-1 2.2-2 3.2"/>
        <path d="M6.2 6.2C4.2 7.5 2.5 9.8 2 12c.5 2.5 4 7 10 7 1.3 0 2.5-.3 3.5-.8"/>
      </svg>
    `;
  }

  // パスワード非表示：斜線なし
  return `
    <svg viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2"
         stroke-linecap="round">
      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
  `;
}


// パスワード表示・非表示
document.getElementById("passwordToggle").addEventListener("click", function() {
  const passwordInput =
    document.getElementById("password");

  const isHidden = passwordInput.type === "password";

  passwordInput.type = isHidden ? "text" : "password";

  this.innerHTML = getEyeIcon(isHidden);

  this.setAttribute(
    "aria-label",
    isHidden ? "パスワードを非表示" : "パスワードを表示"
  );

  this.setAttribute("aria-pressed", String(isHidden));
});


// ヘッダー表示
async function renderHeaderAccount() {
  const headerAccount =
    document.getElementById("headerAccount");

  if (!headerAccount || !window.OTO_SUPABASE) return;

  try {
    const {
      data: { session },
      error
    } = await window.OTO_SUPABASE.auth.getSession();

    if (error) throw error;

    if (!session) {
      headerAccount.innerHTML = `
        <a href="login.html">ログイン</a>
        <a href="signup.html">新規登録</a>
      `;
      return;
    }

    let displayName = "マイプロフィール";

    const {
      data: profile,
      error: profileError
    } = await window.OTO_SUPABASE
      .from("profiles")
      .select("data")
      .eq("id", session.user.id)
      .maybeSingle();

    if (!profileError && profile && profile.data) {
      displayName =
        profile.data.name ||
        profile.data.nickname ||
        "マイプロフィール";
    }

    headerAccount.replaceChildren();

    const profileLink = document.createElement("a");
    profileLink.href = "profile.html";
    profileLink.textContent = displayName;

    const logoutLink = document.createElement("a");
    logoutLink.href = "#";
    logoutLink.textContent = "ログアウト";

    logoutLink.addEventListener("click", async function(event) {
      event.preventDefault();

      if (!confirm("ログアウトしますか？")) return;

      const {
        error: logoutError
      } = await window.OTO_SUPABASE.auth.signOut();

      if (logoutError) {
        alert("ログアウトに失敗しました。\n" + logoutError.message);
        return;
      }

      alert("ログアウトしました。");
      window.location.href = "index.html";
    });

    headerAccount.append(profileLink, logoutLink);

  } catch (error) {
    console.error("ヘッダー表示エラー:", error);
  }
}


// ログイン処理
async function login() {
  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const loginButton =
    document.getElementById("loginButton");

  if (email === "" || password === "") {
    alert("メールアドレスとパスワードを入力してください。");
    return;
  }

  if (!window.OTO_SUPABASE) {
    alert("Supabaseに接続できません。ページを再読み込みしてください。");
    return;
  }

  loginButton.disabled = true;
  loginButton.textContent = "ログイン中...";

  try {
    const {
      data,
      error
    } = await window.OTO_SUPABASE.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      console.error("Supabaseログインエラー:", error);

      if (
        error.message.toLowerCase().includes("email not confirmed")
      ) {
        alert(
          "メールアドレスの認証が完了していません。\n" +
          "認証メールを確認してください。"
        );
      } else {
        alert("メールアドレスまたはパスワードが違います。");
      }

      return;
    }

    if (!data.session) {
      alert("ログイン状態を確認できませんでした。");
      return;
    }

    alert("ログインしました。");

    window.location.href = getReturnTo();

  } catch (error) {
    console.error("ログイン処理エラー:", error);

    alert(
      "ログイン中にエラーが発生しました。\n" +
      "時間をおいてもう一度お試しください。"
    );

  } finally {
    loginButton.disabled = false;
    loginButton.textContent = "ログイン";
  }
}


// ページ読み込み時にヘッダーを更新
renderHeaderAccount();

</script>

</body>
