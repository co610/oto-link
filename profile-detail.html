
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プロフィール詳細 - OTO LINK</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .profile-detail-page {
      width: min(900px, calc(100% - 32px));
      margin: 36px auto 64px;
    }

    .profile-back {
      display: inline-block;
      margin-bottom: 22px;
      color: #333;
      text-decoration: none;
    }

    .profile-back:hover {
      text-decoration: underline;
    }

    .profile-detail-card {
      padding: 28px;
      border: 1px solid #e5e5e1;
      background: #fff;
    }

    .profile-detail-top {
      display: flex;
      align-items: flex-start;
      gap: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid #e5e5e1;
    }

    .profile-avatar {
      display: flex;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      width: 100px;
      height: 100px;
      overflow: hidden;
      border: 1px solid #e5e5e1;
      border-radius: 50%;
      background: #f4f3ef;
      color: #555;
      font-size: 30px;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-main {
      min-width: 0;
      flex: 1;
    }

    .profile-name {
      margin: 0 0 10px;
      font-size: 28px;
      overflow-wrap: anywhere;
    }

    .profile-subtitle {
      margin: 0;
      color: #666;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .profile-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .profile-action-button {
      display: inline-block;
      padding: 11px 18px;
      border: 1px solid #222;
      background: #222;
      color: #fff;
      font: inherit;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
    }

    .profile-action-button:hover {
      background: #444;
    }

    .profile-action-button.secondary {
      background: #fff;
      color: #222;
    }

    .profile-action-button.secondary:hover {
      background: #f5f5f2;
    }

    .profile-info-section {
      padding: 24px 0;
      border-bottom: 1px solid #e5e5e1;
    }

    .profile-info-section:last-child {
      border-bottom: none;
    }

    .profile-info-section h2 {
      margin: 0 0 14px;
      font-size: 19px;
    }

    .profile-info-grid {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 12px 18px;
    }

    .profile-info-label {
      color: #777;
      font-size: 14px;
    }

    .profile-info-value {
      min-width: 0;
      line-height: 1.9;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .profile-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .profile-links a {
      color: #222;
      overflow-wrap: anywhere;
    }

    .profile-empty {
      padding: 28px;
      border: 1px solid #e5e5e1;
      background: #fff;
      line-height: 1.9;
      color: #666;
    }

    .profile-error {
      color: #a32626;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 600px) {
      .profile-detail-card {
        padding: 18px;
      }

      .profile-detail-top {
        flex-direction: column;
        gap: 16px;
      }

      .profile-avatar {
        width: 84px;
        height: 84px;
      }

      .profile-name {
        font-size: 24px;
      }

      .profile-info-grid {
        grid-template-columns: 1fr;
        gap: 5px;
      }

      .profile-info-label {
        margin-top: 10px;
      }

      .profile-actions {
        flex-direction: column;
      }

      .profile-action-button {
        text-align: center;
      }
    }
  </style>
</head>

  <main class="profile-detail-page">
    <a href="profile-list.html" class="profile-back">
      ← プロフィール一覧に戻る
    </a>

    <div id="profileContent">
      <div class="profile-empty">プロフィールを読み込んでいます…</div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase.js"></script>

  <script>
    "use strict";

    const params = new URLSearchParams(window.location.search);
    const targetUserId = params.get("id");
    const content = document.getElementById("profileContent");
    const headerAccount = document.getElementById("headerAccount");
    const otoSupabase = window.OTO_SUPABASE;

    let currentUserId = null;
    let currentProfileName = "";

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderHeader() {
      if (currentUserId) {
        headerAccount.innerHTML = `
          <a href="profile.html" class="header-account-name">${escapeHtml(currentProfileName)}</a>
          <a href="#" id="logoutLink">ログアウト</a>
        `;

        document.getElementById("logoutLink").addEventListener("click", async function(event) {
          event.preventDefault();

          const { error } = await otoSupabase.auth.signOut();

          if (error) {
            alert("ログアウトできませんでした。もう一度お試しください。");
            console.error(error);
            return;
          }

          window.location.href = "index.html";
        });
      } else {
        headerAccount.innerHTML = `
          <a href="login.html">ログイン</a>
          <a href="signup.html">新規登録</a>
        `;
      }
    }

    function getFirstValue(profile, keys) {
      for (const key of keys) {
        const value = profile[key];

        if (
          value !== undefined &&
          value !== null &&
          String(value).trim() !== ""
        ) {
          return value;
        }
      }

      return "";
    }

    function normalizeList(value) {
      if (Array.isArray(value)) {
        return value.filter(Boolean).join("、");
      }

      return String(value || "");
    }

    function renderInfoRow(label, value) {
      if (value === "" || value === null || value === undefined) {
        return "";
      }

      return `
        <div class="profile-info-label">${escapeHtml(label)}</div>
        <div class="profile-info-value">${escapeHtml(value)}</div>
      `;
    }

    function renderWorks(works) {
      if (!Array.isArray(works) || works.length === 0) {
        return "";
      }

      return `
        <section class="profile-info-section">
          <h2>作品・実績</h2>
          <div class="profile-info-grid">
            ${works.map(function(work) {
              const title = escapeHtml(work.title || "タイトル未設定");

              const description = work.description
                ? `<p class="profile-info-value">${escapeHtml(work.description)}</p>`
                : "";

              const url = /^https?:\/\//i.test(work.url || "")
                ? work.url
                : "";

              return `
                <div class="profile-work-item">
                  ${url
                    ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${title}</a>`
                    : `<strong>${title}</strong>`}
                  ${description}
                </div>
              `;
            }).join("")}
          </div>
        </section>
      `;
    }

    function renderLinks(links) {
      if (!Array.isArray(links) || links.length === 0) {
        return "";
      }

      const validLinks = links.filter(function(item) {
        return item && /^https?:\/\//i.test(item.url || "");
      });

      if (validLinks.length === 0) {
        return "";
      }

      return `
        <section class="profile-info-section">
          <h2>活動リンク・SNS</h2>
          <div class="profile-actions">
            ${validLinks.map(function(item) {
              return `
                <a class="profile-action-button secondary"
                  href="${escapeHtml(item.url)}"
                  target="_blank"
                  rel="noopener noreferrer">
                  ${escapeHtml(item.label || item.type || "リンク")}
                </a>
              `;
            }).join("")}
          </div>
        </section>
      `;
    }

    async function loadPostCounts(userId) {
      const postTypes = ["activity", "member", "live"];

      const results = await Promise.all(
        postTypes.map(async function(postType) {
          const { count, error } = await otoSupabase
            .from("posts")
            .select("id", { count: "exact", head: true })
            .eq("user_id", userId)
            .eq("post_type", postType);

          if (error) {
            console.error(postType + "の件数取得エラー:", error);
            return null;
          }

          return count ?? 0;
        })
      );

      return {
        activity: results[0],
        member: results[1],
        live: results[2]
      };
    }

    function renderProfile(profile, postCounts) {
      const isOwnProfile = currentUserId &&
        String(currentUserId) === String(profile.userId);

      const name = getFirstValue(profile, ["name", "nickname"]) || "名前未設定";
      const grade = getFirstValue(profile, ["grade"]);
      const status = getFirstValue(profile, ["activityStatus", "status", "activity"]);
      const area = getFirstValue(profile, ["area"]);

      const parts = normalizeList(
        profile.parts !== undefined ? profile.parts : profile.part
      );

      const genres = normalizeList(
        profile.genres !== undefined ? profile.genres : profile.genre
      );

      const artist = getFirstValue(profile, ["artist"]);

      const introduction = getFirstValue(profile, [
        "introduction",
        "selfIntroduction",
        "bio",
        "about"
      ]);

      const goals = getFirstValue(profile, [
        "wantToTry",
        "goals",
        "dream",
        "dreams",
        "futureGoal"
      ]);

      const iconUrl = getFirstValue(profile, [
        "avatar",
        "icon",
        "iconUrl",
        "profileImage",
        "image"
      ]);

      const dmUrl = currentUserId
        ? "chat-room.html?type=dm&with=" + encodeURIComponent(profile.userId)
        : "login.html";

      const editButton = isOwnProfile
        ? `<a class="profile-action-button secondary" href="profile.html">プロフィールを編集</a>`
        : "";

      const dmButton = isOwnProfile
        ? ""
        : `<a class="profile-action-button" href="${dmUrl}">DMを送る</a>`;

      let avatarHtml;

      if (
        iconUrl &&
        (
          /^https?:\/\//i.test(String(iconUrl)) ||
          /^data:image\//i.test(String(iconUrl))
        )
      ) {
        avatarHtml = `<img src="${escapeHtml(iconUrl)}" alt="プロフィールアイコン">`;
      } else {
        avatarHtml = escapeHtml(name.trim().charAt(0) || "♪");
      }

      const activityCount = postCounts.activity === null
        ? "取得できません"
        : postCounts.activity + "件";

      const memberCount = postCounts.member === null
        ? "取得できません"
        : postCounts.member + "件";

      const liveCount = postCounts.live === null
        ? "取得できません"
        : postCounts.live + "件";

      content.innerHTML = `
        <article class="profile-detail-card">
          <div class="profile-detail-top">
            <div class="profile-avatar">${avatarHtml}</div>

            <div class="profile-main">
              <h1 class="profile-name">${escapeHtml(name)}</h1>

              <p class="profile-subtitle">
                ${escapeHtml([grade, status].filter(Boolean).join(" ・ "))}
              </p>

              <div class="profile-actions">
                ${dmButton}
                ${editButton}
              </div>
            </div>
          </div>

          <section class="profile-info-section">
            <h2>プロフィール</h2>

            <div class="profile-info-grid">
              ${renderInfoRow("学年", grade)}
              ${renderInfoRow("活動地域", area)}
              ${renderInfoRow("活動状況", status)}
              ${renderInfoRow("得意分野", parts)}
              ${renderInfoRow("好きなジャンル", genres)}
              ${renderInfoRow("好きなアーティスト", artist)}
            </div>
          </section>

          <section class="profile-info-section">
            <h2>自己紹介・やってみたいこと</h2>

            <div class="profile-info-value">
              ${introduction
                ? escapeHtml(introduction)
                : "まだ自己紹介は登録されていません。"}
            </div>
          </section>

          ${goals ? `
            <section class="profile-info-section">
              <h2>やってみたいこと</h2>
              <div class="profile-info-value">${escapeHtml(goals)}</div>
            </section>
          ` : ""}

          ${renderWorks(profile.works)}
          ${renderLinks(profile.activityLinks || profile.links)}

          <section class="profile-info-section">
            <h2>OTO LINKでの活動</h2>

            <div class="profile-info-grid">
              ${renderInfoRow("共有した音楽活動", activityCount)}
              ${renderInfoRow("メンバー・協力者募集", memberCount)}
              ${renderInfoRow("ライブ情報", liveCount)}
            </div>

            <div class="profile-actions">
              <a class="profile-action-button secondary" href="bands.html">音楽活動を見る</a>
              <a class="profile-action-button secondary" href="member.html">募集を見る</a>
              <a class="profile-action-button secondary" href="live.html">ライブを見る</a>
            </div>
          </section>
        </article>
      `;

      document.title = name + "のプロフィール - OTO LINK";
    }

    function showError(message, showEditLink) {
      content.innerHTML = `
        <div class="profile-empty profile-error">
          ${escapeHtml(message)}
          ${showEditLink
            ? `<p><a href="profile.html">プロフィールを作成・編集する</a></p>`
            : ""}
          <p><a href="profile-list.html">プロフィール一覧に戻る</a></p>
        </div>
      `;
    }

    async function initialize() {
      try {
        const { data: authData, error: authError } =
          await otoSupabase.auth.getUser();

        if (authError) {
          throw authError;
        }

        currentUserId = authData && authData.user
          ? authData.user.id
          : null;

        if (currentUserId) {
          const { data: ownProfile } = await otoSupabase
            .from("profiles")
            .select("data")
            .eq("id", currentUserId)
            .maybeSingle();

          if (ownProfile && ownProfile.data) {
            currentProfileName = String(
              ownProfile.data.name ||
              ownProfile.data.nickname ||
              ""
            ).trim();
          }
        }

        renderHeader();

        if (!targetUserId) {
          showError(
            "プロフィールが指定されていません。プロフィール一覧から選び直してください。",
            false
          );
          return;
        }

        const { data, error } = await otoSupabase
          .from("profiles")
          .select("id,data")
          .eq("id", targetUserId)
          .maybeSingle();

        if (error) {
          throw error;
        }

        if (!data || !data.data) {
          const isOwn = currentUserId &&
            currentUserId === targetUserId;

          showError(
            isOwn
              ? "まだプロフィールが登録されていません。プロフィール編集画面から登録してください。"
              : "プロフィールが見つかりません。まだ登録されていない可能性があります。",
            Boolean(isOwn)
          );

          return;
        }

        const postCounts = await loadPostCounts(data.id);

        renderProfile(
          { ...data.data, userId: data.id },
          postCounts
        );

      } catch (error) {
        console.error("プロフィール詳細の読み込みエラー:", error);

        renderHeader();

        showError(
          "プロフィールを読み込めませんでした。通信状態とSupabaseの設定を確認してください。",
          false
        );
      }
    }

    initialize();
  </script>
</body>
</html>
